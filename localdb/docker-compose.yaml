services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  backend:
    build: ../backend
    env_file:
      - ../backend/.env
    environment:
      - DB=mongodb://mongo:27017/Login
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    develop:
      watch:
        # Code changes: copy into the running container and restart node
        - action: sync+restart
          path: ../backend
          target: /app
          ignore:
            - node_modules/
            - .env
        # Dependency changes: rebuild the image
        - action: rebuild
          path: ../backend/package.json
        - action: rebuild
          path: ../backend/package-lock.json

  frontend:
    build: ../frontend
    environment:
      - VITE_BACKEND_URL=http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    develop:
      watch:
        # Code changes: copy into the container, Vite hot-reloads them
        - action: sync
          path: ../frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .env
        # Dependency changes: rebuild the image
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/package-lock.json

volumes:
  mongo-data: