services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  backend:
    build: ../backend
    env_file:
      - ../backend/.env
    environment:
      - DB=mongodb://mongo:27017/Login
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
  
  frontend:
    build: ../frontend
    environment:
      - VITE_BACKEND_URL=http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data: